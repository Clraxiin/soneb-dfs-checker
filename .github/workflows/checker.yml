
name: SONEB DFS Appointment Checker

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  check-soneb:

    runs-on: ubuntu-latest

    steps:

      # ============================================
      # Checkout repository
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # Python
      # ============================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================
      # Install dependencies
      # ============================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================
      # Install Playwright Chromium
      # ============================================

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      # ============================================
      # Run checker
      # ============================================

      - name: Run SONEB checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python checker.py

      # ============================================
      # Save heartbeat state
      # ============================================

      - name: Commit heartbeat state
        run: |

          if [ -f heartbeat.txt ]; then

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add heartbeat.txt

            git diff --cached --quiet || git commit -m "Update SONEB heartbeat"

            git push

          else

            echo "No heartbeat file created."

          fi

      # ============================================
      # Upload error screenshot
      # ============================================

      - name: Upload error screenshot
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: soneb-debug
          path: soneb_error.png
          if-no-files-found: ignore

